        <style>body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

.contact-container{
    width:95%;
    margin:auto;
    display:flex;
    gap:30px;
    margin-top:40px;
}

.contact-info{
    width:30%;
}

.contact-form{
    width:70%;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h2{
    margin-top:0;
    color:#162447;
}

.card p{
    color:#666;
}

.card a{
    color:#2563eb;
    text-decoration:none;
}

.row{
    display:flex;
    gap:25px;
    margin-bottom:20px;
}

.row div{
    flex:1;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}</style>

    <body><div class="contact-container">

    <!-- LEFT SIDE -->
    <div class="contact-info">

        <div class="card">
            <h2>Email Us</h2>
            <p>Send us an email anytime</p>
            <a href="#">info@eduverse.in</a>
        </div>

        <div class="card">
            <h2>Call Us</h2>

            <a href="#">+91 9342527593</a>
        </div>

        <div class="card">
            <h2>WhatsApp</h2>
            <p>Chat with us</p>
            <a href="#">+91 9342527593</a>
        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="contact-form">

        <h1>Send us a Message</h1>

        <div class="row">

            <div>
                <label>Full Name</label><br>
                <input type="text" placeholder="Enter your full name">
            </div>

            <div>
                <label>Email</label><br>
                <input type="email" placeholder="Enter your email">
            </div>

        </div>

        <label>Phone Number</label><br>
        <input type="text" placeholder="Enter your phone number">

        <br><br>

        <label>Message</label><br>
        <textarea rows="8" placeholder="Enter your message"></textarea>

        <br><br>

        <button>Send Message</button>

    </div>

</div>
