<!DOCTYPE html>
<html>

<head>

<title>Signup</title>

<link rel="stylesheet" href="signup.css">
<style>

body{

    margin:0;

    background:#f5f5f5;

    font-family:Arial, Helvetica, sans-serif;

}

/* Card */

.signup-box{

    width:450px;

    background:white;

    margin:60px auto;

    padding:40px;

    border-radius:12px;

    box-shadow:0 2px 10px rgba(0,0,0,.1);

}

/* Heading */

.signup-box h1{

    margin:0;

    text-align:center;

    color:#162447;

    font-size:42px;

}

.subtitle{

    text-align:center;

    color:#666;

    margin:15px 0 35px;

    font-size:18px;

}



label{

    display:block;

    margin-bottom:8px;

    margin-top:18px;

    font-weight:bold;

    color:#162447;

}



input{

    width:100%;

    padding:14px;

    font-size:17px;

    border:1px solid #ccc;

    border-radius:8px;

    box-sizing:border-box;

}



input:focus{

    outline:none;

    border:1px solid #2563eb;

}



button{

    width:100%;

    margin-top:30px;

    padding:15px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:8px;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#1d4ed8;

}

button a{

    text-decoration:none;

    color:white;

    font-weight:bold;

}

/* Bottom text */

.login{

    text-align:center;

    margin-top:25px;

    color:#666;

}

.login a{

    text-decoration:none;

    color:#2563eb;

    font-weight:bold;

}
</style>
</head>

<body>

<div class="signup-box">

    <h1>Create your account</h1>

    <p class="subtitle">
        Join EduVerse to access mock tests and study resources
    </p>

    <form>

        <label>Full Name *</label>
        <input type="text" placeholder="Enter your full name">

        <label>Phone Number *</label>
        <input type="text" placeholder="Enter your 10 digit number">

        <label>Email Address *</label>
        <input type="email" placeholder="Enter your email">

        <label>Password *</label>
        <input type="password" placeholder="Enter your password">

        <label>Confirm Password *</label>
        <input type="password" placeholder="Confirm your password">

        <label>City *</label>
        <input type="text" placeholder="Enter your city">

        <button><a href="login.html">Create Account</a></button>

    </form>

    <p class="login">
        Already have an account?
        <a href="login.html">Sign In</a>
    </p>

</div>

</body>

</html>
