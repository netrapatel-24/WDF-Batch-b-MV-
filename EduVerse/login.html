<!DOCTYPE html>
<html>

<head>
<title>Signup</title>
<link rel="stylesheet" href="login.css">
<script src="script.js"></script>
</head>
<body>

<div class="sb">
    <h1>Create your account</h1>
    <p class="st">Join EduVerse to access mock tests and study resources</p>
    
<form action="process.php" method="POST" onsubmit="return validateForm()">
    <label>Full Name</label>
    <input type="text" name="name" placeholder="Enter your full name" required>

    <label>Phone Number</label>
    <input type="text" name="phone" placeholder="Enter your 10 digit number" required>

    <label>Email Address</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password" required>

    <label>Confirm Password</label>
    <input type="password" name="confirm" placeholder="Confirm your password" required>

    <label>City</label>
    <input type="text" name="city" placeholder="Enter your city" required>

    <button type="submit">Create Account</button>
</form>

    <p class="login">
        Already have an account?
        <a href="signup.html">Sign In</a>
    </p>

</div>

</body>

</html>
