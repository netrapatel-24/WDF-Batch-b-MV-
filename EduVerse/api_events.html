
<!DOCTYPE html>
<html>
<head>
    <title>EduVerse - Events API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
            background: #f4f4f4;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        input, textarea, button {
            padding: 9px;
            margin: 5px 0;
        }

        input, textarea {
            width: 95%;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #007bff;
            color: white;
        }

        #message {
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Event Management</h1>
    <p><a href="admin.php">Back to Admin Dashboard</a></p>

    <h2 id="formTitle">Add Event</h2>

    <form id="eventForm">
        <input type="hidden" id="event_id">

        <label>Event Name</label>
        <input type="text" id="event_name" maxlength="100" required>

        <label>Event Date</label>
        <input type="date" id="event_date" required>

        <label>Venue</label>
        <input type="text" id="venue" maxlength="100">

        <label>Description</label>
        <textarea id="description" maxlength="255"></textarea>

        <button type="submit" id="saveButton">Add Event</button>
        <button type="button" id="cancelButton" hidden>Cancel Edit</button>
    </form>

    <p id="message"></p>

    <h2>All Events</h2>

    <button type="button" id="refreshButton">Refresh Events</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Event Name</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="eventList"></tbody>
    </table>
</div>

<script>
const api = "events_api.php";

const form = document.getElementById("eventForm");
const eventList = document.getElementById("eventList");
const message = document.getElementById("message");

async function loadEvents() {
    try {
        const response = await fetch(api);
        const result = await response.json();

        if (!response.ok || !result.success) {
            message.textContent = result.message || "Could not load events.";
            eventList.replaceChildren();
            return;
        }

        eventList.replaceChildren();

        result.data.forEach(function(event) {
            const row = document.createElement("tr");

            [
                event.event_id,
                event.event_name,
                event.event_date,
                event.venue || "",
                event.description || ""
            ].forEach(function(value) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.addEventListener("click", function() {
                editEvent(event);
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", function() {
                deleteEvent(event.event_id);
            });

            actions.appendChild(editButton);
            actions.appendChild(deleteButton);
            row.appendChild(actions);
            eventList.appendChild(row);
        });

        message.textContent = "Events loaded successfully.";
    } catch (error) {
        message.textContent = "Error connecting to the API.";
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("event_id").value;

    const data = {
        action: id ? "update" : "add",
        event_id: id,
        event_name: document.getElementById("event_name").value,
        event_date: document.getElementById("event_date").value,
        venue: document.getElementById("venue").value,
        description: document.getElementById("description").value
    };

    try {
        const response = await fetch(api, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        message.textContent = result.message;

        if (response.ok && result.success) {
            resetForm();
            loadEvents();
        }
    } catch (error) {
        message.textContent = "Error connecting to the API.";
    }
});

function editEvent(event) {
    document.getElementById("event_id").value = event.event_id;
    document.getElementById("event_name").value = event.event_name;
    document.getElementById("event_date").value = event.event_date;
    document.getElementById("venue").value = event.venue || "";
    document.getElementById("description").value = event.description || "";

    document.getElementById("formTitle").textContent = "Update Event";
    document.getElementById("saveButton").textContent = "Update Event";
    document.getElementById("cancelButton").hidden = false;
}

async function deleteEvent(id) {
    if (!confirm("Are you sure you want to delete this event?")) {
        return;
    }

    try {
        const response = await fetch(api, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "delete",
                event_id: id
            })
        });

        const result = await response.json();
        message.textContent = result.message;

        if (response.ok && result.success) {
            loadEvents();
        }
    } catch (error) {
        message.textContent = "Error connecting to the API.";
    }
}

function resetForm() {
    form.reset();
    document.getElementById("event_id").value = "";
    document.getElementById("formTitle").textContent = "Add Event";
    document.getElementById("saveButton").textContent = "Add Event";
    document.getElementById("cancelButton").hidden = true;
}

document.getElementById("cancelButton").addEventListener("click", resetForm);
document.getElementById("refreshButton").addEventListener("click", loadEvents);

loadEvents();
</script>

</body>
</html>
